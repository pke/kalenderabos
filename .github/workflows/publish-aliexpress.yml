name: Publish AliExpress sales calendar

on:
  push:
    branches: [master]
    paths:
      - "apps/aliexpress-sales/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/scripts/stage-pages.sh"
      - ".github/workflows/publish-aliexpress.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test AliExpress calendar
        run: pnpm --filter @kalenderabos/aliexpress-sales test
      - name: Build AliExpress calendar
        run: pnpm --filter @kalenderabos/aliexpress-sales build
      - name: Update Pages state
        id: pages-state
        shell: bash
        run: bash .github/scripts/stage-pages.sh apps/aliexpress-sales/www aesales aesales.ics
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.pages-state.outputs.artifact-directory }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
