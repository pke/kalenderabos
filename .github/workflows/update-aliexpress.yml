name: Update AliExpress sales calendar

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Update and validate calendar
        run: pnpm --filter @kalenderabos/aliexpress-sales update
      - name: Test AliExpress calendar
        run: pnpm --filter @kalenderabos/aliexpress-sales test
      - name: Build AliExpress calendar
        run: pnpm --filter @kalenderabos/aliexpress-sales build
      - name: Commit changed event data
        shell: bash
        run: |
          git add apps/aliexpress-sales/lib/events.ts
          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update AliExpress sales calendar"
          git push
      - name: Update Pages state
        id: pages-state
        shell: bash
        run: bash .github/scripts/stage-pages.sh apps/aliexpress-sales/www aesales aesales.ics
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.pages-state.outputs.artifact-directory }}

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
