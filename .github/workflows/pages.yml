name: Check and publish school holiday calendars

on:
  push:
    branches: [master]
    paths:
      - "apps/school-holidays/**"
      - ".github/scripts/stage-pages.sh"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check-source:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.compare.outputs.should-build }}
      source-commit: ${{ steps.source.outputs.commit }}
      source-tree: ${{ steps.source.outputs.tree }}
      supplement-revision: ${{ steps.supplements.outputs.revision }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v6
      - name: Check out OpenHolidays data
        uses: actions/checkout@v6
        with:
          repository: openpotato/openholidaysapi.data
          ref: main
          fetch-depth: 1
          path: .upstream
      - name: Read exact source revision
        id: source
        shell: bash
        run: |
          echo "commit=$(git -C .upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git -C .upstream rev-parse HEAD:src)" >> "$GITHUB_OUTPUT"
      - name: Fingerprint local supplements
        id: supplements
        shell: bash
        run: echo "revision=$(node apps/school-holidays/scripts/fingerprint-supplements.mjs)" >> "$GITHUB_OUTPUT"
      - name: Compare source data tree
        id: compare
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
          SUPPLEMENT_REVISION: ${{ steps.supplements.outputs.revision }}
        run: |
          recorded_tree=$(node -p "require('./.github/source-state.json').sourceTreeSha || ''")
          recorded_supplements=$(node -p "require('./.github/source-state.json').supplementRevision || ''")
          if [[ "$EVENT_NAME" != "schedule" || "$SOURCE_TREE" != "$recorded_tree" || "$SUPPLEMENT_REVISION" != "$recorded_supplements" ]]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-source
    if: needs.check-source.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out this repository
        uses: actions/checkout@v6
      - name: Check out pinned OpenHolidays data
        uses: actions/checkout@v6
        with:
          repository: openpotato/openholidaysapi.data
          ref: ${{ needs.check-source.outputs.source-commit }}
          fetch-depth: 1
          path: .upstream
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run generator tests
        working-directory: apps/school-holidays
        run: node --test
      - name: Generate static site and calendars
        working-directory: apps/school-holidays
        env:
          SOURCE_COMMIT: ${{ needs.check-source.outputs.source-commit }}
          SOURCE_TREE_SHA: ${{ needs.check-source.outputs.source-tree }}
        run: node scripts/generate-static.mjs --source ../../.upstream
      - name: Verify generated subscriptions
        working-directory: apps/school-holidays
        env:
          EXPECTED_SUPPLEMENT_REVISION: ${{ needs.check-source.outputs.supplement-revision }}
        run: node scripts/verify-static.mjs
      - name: Update Pages state
        id: pages-state
        shell: bash
        run: bash .github/scripts/stage-pages.sh apps/school-holidays/www schulferien
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.pages-state.outputs.artifact-directory }}

  deploy:
    needs: [check-source, build]
    if: needs.check-source.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record-source:
    needs: [check-source, build, deploy]
    if: >-
      always() &&
      needs.check-source.result == 'success' &&
      (needs.check-source.outputs.should-build != 'true' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Record successful source check
        uses: actions/github-script@v9
        env:
          SOURCE_COMMIT: ${{ needs.check-source.outputs.source-commit }}
          SOURCE_TREE_SHA: ${{ needs.check-source.outputs.source-tree }}
          SUPPLEMENT_REVISION: ${{ needs.check-source.outputs.supplement-revision }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repositoryNameWithOwner = `${owner}/${repo}`;
            const state = {
              branch: "main",
              sourceCommit: process.env.SOURCE_COMMIT,
              sourceTreeSha: process.env.SOURCE_TREE_SHA,
              supplementRevision: process.env.SUPPLEMENT_REVISION,
              checkedAt: new Date().toISOString(),
            };
            const contents = Buffer.from(`${JSON.stringify(state, null, 2)}\n`).toString("base64");

            const current = await github.graphql(`
              query CurrentHead($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  ref(qualifiedName: "refs/heads/master") {
                    target { oid }
                  }
                }
              }
            `, { owner, repo });
            const expectedHeadOid = current.repository.ref.target.oid;

            const result = await github.graphql(`
              mutation RecordSource($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit { oid url }
                }
              }
            `, {
              input: {
                branch: { repositoryNameWithOwner, branchName: "master" },
                expectedHeadOid,
                message: { headline: "chore: record OpenHolidays source check" },
                fileChanges: {
                  additions: [{ path: ".github/source-state.json", contents }],
                },
              },
            });

            const commit = result.createCommitOnBranch.commit;
            const verification = await github.rest.repos.getCommit({ owner, repo, ref: commit.oid });
            if (!verification.data.commit.verification?.verified) {
              core.setFailed(`GitHub did not verify ${commit.oid}`);
              return;
            }
            core.info(`Recorded source state in verified commit ${commit.url}`);
